name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep retries for the same tag serialized so only one draft release attempt
  # can publish assets for a given immutable ref.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Validate dispatched ref
        id: version
        run: |
          set -euo pipefail
          # Release Cut dispatches this workflow on the tag ref it just created;
          # direct manual runs against branches are rejected here.
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Release workflow must be dispatched on a v* tag ref; got ${GITHUB_REF}" >&2
            exit 1
          fi
          tools/release/version.sh is-stable-tag "${GITHUB_REF_NAME}"
          version=$(tools/release/version.sh normalize "${GITHUB_REF_NAME}")
          echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            artifact: braid-linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            artifact: braid-linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            artifact: braid-darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            artifact: braid-darwin-arm64
            runner: macos-15
          - platform: windows-amd64
            artifact: braid-windows-amd64.exe
            runner: windows-2025
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Set up Bazelisk
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="bazelisk-linux-amd64"; sha256="5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992" ;;
            Linux-ARM64) asset="bazelisk-linux-arm64"; sha256="e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010" ;;
            macOS-X64) asset="bazelisk-darwin-amd64"; sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007" ;;
            macOS-ARM64) asset="bazelisk-darwin-arm64"; sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409" ;;
            Windows-X64) asset="bazelisk-windows-amd64.exe"; sha256="092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          bazelisk_dir="${RUNNER_TEMP//\\//}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          executable=bazel
          if [[ "${RUNNER_OS}" == Windows ]]; then executable=bazel.exe; fi
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" -o "${bazelisk_dir}/${executable}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | sha256sum -c -
          fi
          chmod +x "${bazelisk_dir}/${executable}"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"

      - name: Test integration
        shell: bash
        run: |
          set -euo pipefail
          # The release integration gate runs the stamped binary on each native
          # platform so the artifact version matches the tag, not 0.0.0-dev.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' bazel test \
            --stamp \
            --embed_label="${VERSION}" \
            --test_env=BRAID_EXPECTED_VERSION="${VERSION}" \
            --test_env=PATH \
            //integration/...

      - name: Build artifact
        shell: bash
        run: tools/release/build-artifact.sh "${{ matrix.platform }}" "${VERSION}"

      - name: Smoke artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          output=$(dist/${{ matrix.artifact }} version)
          if [[ "${output}" != "braid ${VERSION}" ]]; then
            echo "version output ${output}; want braid ${VERSION}" >&2
            exit 1
          fi

      - name: Smoke Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = & ".\dist\${{ matrix.artifact }}" version
          if ($output -ne "braid $env:VERSION") {
            throw "version output $output; want braid $env:VERSION"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          # Matrix jobs do not write release assets directly; the publish job
          # verifies the complete set before creating a draft release.
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: braid-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Checksums are generated only after all matrix artifacts are present;
          # unsigned macOS binaries are intentional for the first automation.
          chmod +x dist/braid-linux-amd64 dist/braid-linux-arm64 dist/braid-darwin-amd64 dist/braid-darwin-arm64
          (cd dist && shasum -a 256 braid-* > SHA256SUMS)
          tools/release/verify-dist.sh dist

      - name: Create draft release
        run: tools/release/publish-draft.sh "${TAG}" "${VERSION}" dist
